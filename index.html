<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시아의 포켓몬 도감</title>
  
  <!-- Favicon: 몬스터볼 SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23ef4444'/><path d='M2 50 A48 48 0 0 0 98 50 Z' fill='%23ffffff'/><rect x='2' y='46' width='96' height='8' fill='%231e293b'/><circle cx='50' cy='50' r='16' fill='%23ffffff' stroke='%231e293b' stroke-width='8'/><circle cx='50' cy='50' r='6' fill='%231e293b'/></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            poke: {
              red: '#ef4444',
              dark: '#dc2626'
            }
          }
        }
      }
    }
  </script>

  <!-- 커스텀 스타일시트 (캐시 방지 버전 파라미터) -->
  <link rel="stylesheet" href="style.css?v=20261107_1" />
</head>
<body class="min-h-screen flex flex-col">

  <!-- 헤더 영역 -->
  <header class="glass-header sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 min-h-[3.5rem] sm:h-16 flex items-center justify-between gap-2 sm:gap-4 py-2 sm:py-0">
      
      <!-- 로고 및 서비스명 -->
      <a href="#" class="flex items-center gap-2 sm:gap-3 group shrink min-w-0">
        <!-- 몬스터볼 SVG 아이콘 -->
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full relative overflow-hidden border-2 border-slate-900 group-hover:rotate-45 transition-transform duration-300 shadow-sm shrink-0">
          <div class="h-1/2 bg-red-500"></div>
          <div class="h-1/2 bg-white"></div>
          <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 h-1 bg-slate-900"></div>
          <div class="absolute inset-0 m-auto w-3 h-3 sm:w-3.5 sm:h-3.5 bg-white border-2 border-slate-900 rounded-full"></div>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-lg font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-1 sm:gap-1.5 whitespace-nowrap">
            <span>시아의 포켓몬 도감</span>
            <span class="text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-600 dark:bg-red-950 dark:text-red-400 shrink-0">전국도감</span>
          </h1>
          <p class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 font-medium hidden sm:block truncate">1세대 관동부터 9세대 팔데아까지 (1~1025)</p>
        </div>
      </a>

      <!-- 헤더 우측 유틸리티 버튼 -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        
        <!-- 최신 데이터 갱신 버튼 -->
        <button id="refreshBtn" 
                title="최신 도감 데이터로 갱신 (캐시 초기화)" 
                class="inline-flex items-center gap-1 px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold hover:border-red-400 hover:text-red-500 transition-all shadow-sm active:scale-95">
          <svg id="refreshIcon" class="w-3.5 h-3.5 stroke-current transition-transform duration-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="text-[11px] sm:text-xs">갱신</span>
        </button>

        <!-- 즐겨찾기(찜) 보기 토글 버튼 -->
        <button id="favFilterBtn" 
                title="내 즐겨찾기"
                class="inline-flex items-center gap-1 px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold hover:border-red-400 transition-all shadow-sm">
          <svg class="w-4 h-4 fill-current text-red-500 shrink-0" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="hidden sm:inline">내 즐겨찾기</span>
          <span id="favCountBadge" class="hidden px-1.5 py-0.2 rounded-full text-[10px] bg-red-500 text-white font-extrabold">0</span>
        </button>

        <!-- 테마 전환 버튼 (다크/라이트) -->
        <button id="themeToggleBtn" 
                title="다크 모드 전환" 
                class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-amber-500 dark:hover:text-amber-400 transition-colors shadow-sm shrink-0">
          <!-- 다크모드 시 달, 라이트모드 시 해 -->
          <svg class="w-4 h-4 hidden dark:block stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="w-4 h-4 block dark:hidden fill-current" viewBox="0 0 24 24">
            <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>

      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6 w-full flex-1">
    
    <!-- 검색 및 정렬 바 -->
    <div class="mb-4 sm:mb-5 flex flex-col sm:flex-row gap-2.5 sm:gap-3">
      <!-- 검색창 -->
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input 
          id="searchInput" 
          type="text" 
          placeholder="포켓몬 이름 또는 번호(#25) 검색..." 
          class="w-full pl-10 pr-10 py-2.5 sm:py-3 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all text-slate-800 dark:text-slate-100 shadow-sm"
        />
        <button id="clearSearchBtn" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>

      <!-- 정렬 셀렉트 박스 -->
      <div class="sm:w-48 shrink-0">
        <select id="sortSelect" class="w-full py-2.5 sm:py-3 px-3.5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:border-red-500 shadow-sm cursor-pointer">
          <option value="id-asc">도감 번호순 (낮은순)</option>
          <option value="id-desc">도감 번호순 (높은순)</option>
          <option value="name-asc">이름 가나다순</option>
        </select>
      </div>
    </div>

    <!-- 세대 선택 탭 (가로 스크롤) -->
    <div class="mb-4">
      <div id="genTabs" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <!-- 타입(속성) 필터 칩 바 (가로 스크롤) -->
    <div class="mb-6">
      <div id="typeFilters" class="flex flex-wrap gap-2">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <!-- 현재 필터 상태 및 검색 결과 수 -->
    <div class="flex items-center justify-between mb-4 px-1">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">
        포켓몬 목록
      </span>
      <span id="resultCount" class="text-xs font-extrabold text-slate-600 dark:text-slate-300">
        0마리
      </span>
    </div>

    <!-- 포켓몬 카드 그리드 -->
    <div id="cardGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
      <!-- JS로 동적 렌더링 -->
    </div>

    <!-- 더보기 버튼 컨테이너 -->
    <div id="loadMoreContainer" class="mt-8 text-center hidden">
      <button id="loadMoreBtn" class="px-6 py-2.5 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-bold text-slate-700 dark:text-slate-200 hover:border-red-500 hover:text-red-500 shadow-sm transition-all">
        더 보기
      </button>
    </div>

  </main>

  <!-- 푸터 -->
  <footer class="mt-auto py-8 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">
    <p class="mb-1">포켓몬 관련 모든 이미지 및 데이터의 저작권은 © Pokémon, Nintendo, Creatures Inc., GAME FREAK inc.에 있습니다.</p>
    <p>Data powered by PokeAPI | Built with Pure HTML, CSS, JavaScript</p>
  </footer>

  <!-- 상세 정보 모달 -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-content">
      
      <!-- 모달 닫기 버튼 -->
      <button id="modalCloseBtn" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all shadow-sm">
        <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- 이전 포켓몬 버튼 -->
      <button id="modalPrevBtn" title="이전 포켓몬 (←)" class="absolute top-1/2 left-1 sm:-left-5 -translate-y-1/2 z-20 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 hover:border-red-500 shadow-md transition-all">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- 다음 포켓몬 버튼 -->
      <button id="modalNextBtn" title="다음 포켓몬 (→)" class="absolute top-1/2 right-1 sm:-right-5 -translate-y-1/2 z-20 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 hover:border-red-500 shadow-md transition-all">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <!-- 모달 동적 바디 -->
      <div id="modalBody">
        <!-- JS로 렌더링 -->
      </div>
    </div>
  </div>

  <!-- 맨 위로 플로팅 버튼 -->
  <button id="scrollTopBtn" title="맨 위로" class="fixed bottom-6 right-6 z-30 w-11 h-11 rounded-full bg-red-500 text-white shadow-lg flex items-center justify-center opacity-0 pointer-events-none hover:bg-red-600 hover:scale-110 active:scale-95 transition-all">
    <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
  </button>

  <!-- 포켓몬 데이터 (캐시 무효화 버전 적용) -->
  <script src="data/pokedex.js?v=20261107_1"></script>
  <!-- 메인 스크립트 -->
  <script src="app.js?v=20261107_1"></script>
</body>
</html>
